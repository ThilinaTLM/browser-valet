<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 300px; margin: 12px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  label { display: block; margin-top: 8px; color: #444; }
  input[type=text], input[type=number] { width: 100%; box-sizing: border-box; padding: 4px; font-family: monospace; }
  .row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  #status { padding: 6px; border-radius: 4px; background: #eee; }
  #status.connected { background: #d6f5dd; }
  #status.error { background: #fbdcdc; }
  button { margin-top: 10px; padding: 5px 12px; }
  .hint { color: #777; font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
  <h1>Browser Bridge</h1>
  <div id="status">…</div>
  <label>Token <input id="token" type="text" placeholder="output of `bctl token`"></label>
  <label>Port <input id="port" type="number"></label>
  <div class="row"><input id="enabled" type="checkbox"><label for="enabled" style="margin:0">Enabled</label></div>
  <button id="save">Save &amp; connect</button>
  <div class="hint">Run <code>bctl status</code> to start the daemon. Anything holding the token can control this browser.</div>
  <script src="popup.js"></script>
</body>
</html>
