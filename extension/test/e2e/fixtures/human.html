<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture Human</title>
    <style>
      body {
        margin: 0;
        height: 800px;
      }
      #btn {
        position: absolute;
        left: 400px;
        top: 200px;
        width: 120px;
        height: 40px;
      }
      #menu {
        position: absolute;
        left: 100px;
        top: 300px;
        width: 120px;
        height: 40px;
        background: #cde;
      }
      #knob {
        position: absolute;
        left: 20px;
        top: 500px;
        width: 40px;
        height: 40px;
        background: #c33;
      }
      #card {
        position: absolute;
        left: 20px;
        top: 650px;
        width: 60px;
        height: 40px;
        background: #36c;
      }
      #bin {
        position: absolute;
        left: 300px;
        top: 650px;
        width: 100px;
        height: 60px;
        background: #fc3;
      }
      #zone {
        position: absolute;
        left: 500px;
        top: 560px;
        width: 100px;
        height: 100px;
        background: #3c3;
      }
    </style>
  </head>
  <body>
    <button id="btn">Go</button>
    <div id="menu">menu</div>
    <div id="knob">knob</div>
    <div id="zone">zone</div>
    <div id="card" draggable="true">card</div>
    <div id="bin">bin</div>
    <script>
      // Every pointer event as "type x,y"; a mouse-driven drag of #knob that reports the drop.
      window.events = [];
      window.dropped = false;
      let dragging = false;
      window.htmlDropped = 0;
      const bin = document.getElementById('bin');
      bin.addEventListener('dragover', (e) => e.preventDefault());
      bin.addEventListener('drop', (e) => {
        e.preventDefault();
        window.htmlDropped++;
      });
      for (const type of ['mousemove', 'mousedown', 'mouseup', 'click', 'dblclick']) {
        addEventListener(type, (e) => events.push(`${type} ${e.clientX},${e.clientY}`));
      }
      document.getElementById('knob').addEventListener('mousedown', () => (dragging = true));
      addEventListener('mouseup', (e) => {
        if (dragging && document.elementFromPoint(e.clientX, e.clientY)?.id === 'zone') {
          window.dropped = true;
        }
        dragging = false;
      });
    </script>
  </body>
</html>
