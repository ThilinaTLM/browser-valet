[package]
name = "browser-bridge"
version = "0.1.0"
edition = "2021"
description = "Control your real Chrome browser from the command line via a companion extension"

[[bin]]
name = "bctl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "5"
futures-util = "0.3"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ureq = { version = "2", features = ["json"] }
