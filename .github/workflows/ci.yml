name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - "docs/**"
      - "README.md"
      - "SKILL.md" # root stub only; cli/skills/** is embedded and still triggers CI
      - "LICENSE"
      - "NOTICE"
  pull_request:
    paths-ignore: *docs-only
  workflow_call: # reused by release.yml on tag pushes (path filters don't apply)

# One run per ref: a newer push cancels the older run. Never cancel on tags (release CI).
# The group is hard-coded: under workflow_call, github.workflow is the caller's name.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  extension:
    name: Extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: extension/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm check` + `pnpm test` + `pnpm build`, split into concurrent steps with separate logs.
      - parallel:
          - name: Typecheck
            run: pnpm typecheck
          - name: Lint
            run: pnpm lint
          - name: Check formatting
            run: pnpm format:check
          - name: Run unit tests
            run: pnpm test
          - name: Build extension
            run: pnpm build

      - name: Upload extension build
        uses: actions/upload-artifact@v7
        with:
          name: extension-dist
          path: extension/dist
          retention-days: 3
          if-no-files-found: error

  cli:
    name: CLI (${{ matrix.label }})
    # cli/tests/relay.rs only covers managed updates when extension/dist is embedded.
    needs: extension
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: Linux }
          - { os: macos-latest, label: macOS }
          - { os: windows-latest, label: Windows }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download extension build
        uses: actions/download-artifact@v8
        with:
          name: extension-dist
          path: extension/dist

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Sequential on purpose: these share cargo's target-dir lock.
      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

  # Real Chrome for Testing + the real extension + a real bvl, headless. Branded Chrome 137+
  # ignores --load-extension, so install Chrome for Testing explicitly. Builds everything
  # itself, so it starts right away instead of waiting for the Extension job.
  e2e:
    name: E2E (Chrome for Testing)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: extension/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - parallel:
          - name: Install Chrome for Testing
            working-directory: ${{ runner.temp }} # npx misbehaves inside the pnpm project
            run: |
              out=$(npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome")
              echo "CHROME_PATH=${out#* }" >> "$GITHUB_ENV"
          # Extension first: cli/build.rs embeds extension/dist.
          - name: Build extension and bvl
            run: |
              pnpm install --frozen-lockfile
              pnpm build
              cargo build --locked --manifest-path ../cli/Cargo.toml

      - name: Run E2E tests
        run: pnpm test:e2e # uses the prebuilt cli/target/debug/bvl
        env:
          CI: true
          E2E_SKIP_BUILD: 1

  # scripts/install.sh and install.ps1 against the latest published release, plus a mirror with
  # a wrong checksum that must be refused.
  installers:
    name: Installers (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: Linux }
          - { os: macos-latest, label: macOS }
          - { os: windows-latest, label: Windows }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Lint install.sh
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh

      - name: install.sh (latest, piped, then upgrade over itself)
        if: runner.os != 'Windows'
        run: |
          dir="$RUNNER_TEMP/bin"
          sh scripts/install.sh < /dev/null   # default ~/.local/bin
          ~/.local/bin/bvl version
          cat scripts/install.sh | BVL_INSTALL_DIR="$dir" sh
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          BVL_VERSION="$tag" BVL_INSTALL_DIR="$dir" sh scripts/install.sh
          "$dir/bvl" version | grep -F "bvl ${tag#v}"

      - name: install.sh refuses a bad checksum
        if: runner.os != 'Windows'
        run: |
          m="$RUNNER_TEMP/mirror/latest/download"; mkdir -p "$m"
          gh release download --repo "$GITHUB_REPOSITORY" --dir "$m" --pattern 'bvl-*.tar.gz'
          for f in "$m"/bvl-*; do echo "0000  ${f##*/}"; done > "$m/SHA256SUMS"
          if BVL_BASE_URL="file://$RUNNER_TEMP/mirror" BVL_INSTALL_DIR="$RUNNER_TEMP/bad" sh scripts/install.sh; then
            echo "::error::installed despite a checksum mismatch"; exit 1
          fi
          test ! -e "$RUNNER_TEMP/bad/bvl"

      - name: install.ps1 (Windows PowerShell 5.1, via iex)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:BVL_INSTALL_DIR = "$env:RUNNER_TEMP\bvl51"
          $env:BVL_NO_MODIFY_PATH = '1'
          Get-Content scripts\install.ps1 -Raw | Invoke-Expression
          & "$env:BVL_INSTALL_DIR\bvl.exe" version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: install.ps1 (PowerShell 7, PATH, upgrade while bvl.exe runs)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:BVL_INSTALL_DIR = "$env:RUNNER_TEMP\bvl7"
          & .\scripts\install.ps1
          $exe = "$env:BVL_INSTALL_DIR\bvl.exe"
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains $env:BVL_INSTALL_DIR) { throw 'install dir not added to the user PATH' }
          # A running bvl.exe must not block the upgrade (it is renamed aside, not overwritten).
          # The proxy needs a config (throwaway secret) to stay up.
          $env:BVL_CONFIG_DIR = "$env:RUNNER_TEMP\bvlcfg"
          New-Item -ItemType Directory -Force $env:BVL_CONFIG_DIR | Out-Null
          '{"secret":"ci-throwaway-secret-0123456789abcdef","port":47999}' | Set-Content "$env:BVL_CONFIG_DIR\config.json"
          $p = Start-Process -FilePath $exe -ArgumentList 'proxy' -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 1
            if ($p.HasExited) { throw "bvl proxy exited early ($($p.ExitCode))" }
            $tag = gh release view --repo $env:GITHUB_REPOSITORY --json tagName -q .tagName
            $env:BVL_VERSION = $tag
            & .\scripts\install.ps1
            $v = & $exe version
            if ($v -ne "bvl $($tag.TrimStart('v'))") { throw "unexpected version: $v" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: install.ps1 refuses a bad checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $m = "$env:RUNNER_TEMP\mirror\latest\download"
          New-Item -ItemType Directory -Force $m | Out-Null
          gh release download --repo $env:GITHUB_REPOSITORY --dir $m --pattern 'bvl-*.zip'
          Get-ChildItem $m -Filter 'bvl-*' | ForEach-Object { "0000  $($_.Name)" } | Set-Content "$m\SHA256SUMS"
          $srv = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', "$env:RUNNER_TEMP\mirror" -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2
            $env:BVL_BASE_URL = 'http://127.0.0.1:8765'
            $env:BVL_INSTALL_DIR = "$env:RUNNER_TEMP\bad"
            $env:BVL_NO_MODIFY_PATH = '1'
            $failed = $false
            try { & .\scripts\install.ps1 } catch { $failed = $true; Write-Host "refused: $_" }
            if (-not $failed) { throw 'installed despite a checksum mismatch' }
            if (Test-Path "$env:BVL_INSTALL_DIR\bvl.exe") { throw 'bvl.exe was written' }
          } finally {
            Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          }
