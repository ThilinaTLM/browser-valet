name: ci
on: [push, pull_request]

jobs:
  cli:
    needs: extension
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: extension-dist
          path: extension/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: bvl-${{ matrix.os }}
          path: |
            cli/target/release/bvl
            cli/target/release/bvl.exe

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extension/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check # typecheck + eslint + prettier
      - run: pnpm test # unit tests (Vitest, mocked chrome.*)
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: extension/dist

  # Real Chrome for Testing + the real extension + a real bvl, headless. Branded Chrome 137+
  # ignores --load-extension, so install Chrome for Testing explicitly.
  e2e:
    needs: extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extension/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: pnpm install --frozen-lockfile
      - name: Install Chrome for Testing
        working-directory: ${{ runner.temp }} # npx misbehaves inside the pnpm project
        run: |
          out=$(npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome")
          echo "CHROME_PATH=${out#* }" >> "$GITHUB_ENV"
      - run: pnpm test:e2e # builds the extension and `cargo build`s bvl itself
        env:
          CI: true
