name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]

# Never cancel a release halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-version:
    name: Verify version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check the tag matches the CLI, extension and manifest versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cli=$(grep -m1 '^version' cli/Cargo.toml | cut -d'"' -f2)
          pkg=$(jq -r .version extension/package.json)
          man=$(jq -r .version extension/static/manifest.json)
          echo "tag=$tag cli=$cli package.json=$pkg manifest.json=$man"
          [ "$tag" = "$cli" ] && [ "$tag" = "$pkg" ] && [ "$tag" = "$man" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match the versions in the repo"; exit 1; }

  # Full CI (fmt, clippy, tests on all OSes, extension checks, E2E). Also produces the
  # `extension-dist` artifact that every release binary embeds. Gated on the version check so
  # a mismatched tag fails fast without running the matrix.
  ci:
    name: CI
    needs: verify-version
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.target }})
    needs: ci
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # No rust-cache: tag-scoped caches are never restored by later tags.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download extension build
        uses: actions/download-artifact@v8
        with:
          name: extension-dist
          path: extension/dist

      - parallel:
          - name: Install musl tools
            shell: bash
            run: |
              if [[ "${{ matrix.target }}" == *linux-musl ]]; then
                sudo apt-get update && sudo apt-get install -y musl-tools
              fi
          - name: Set up Rust
            uses: dtolnay/rust-toolchain@stable
            with:
              targets: ${{ matrix.target }}

      - name: Build bvl
        working-directory: cli
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="bvl-${{ matrix.target }}"
          mkdir -p "pkg/$name" out
          cp LICENSE NOTICE README.md "pkg/$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "cli/target/${{ matrix.target }}/release/bvl.exe" "pkg/$name/"
            (cd "pkg/$name" && 7z a "../../out/$name.zip" .)
          else
            cp "cli/target/${{ matrix.target }}/release/bvl" "pkg/$name/"
            tar -czf "out/$name.tar.gz" -C "pkg/$name" .
          fi
          ls -l out

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: out/*
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: out
          merge-multiple: true

      # Shipped as release assets so `releases/latest/download/install.sh` always matches the
      # binaries next to it.
      - name: Add installer scripts
        run: cp scripts/install.sh scripts/install.ps1 out/

      - name: Write checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
