[package]
name = "browser-bridge"
version = "0.3.0"
edition = "2021"
description = "Control your real Chrome browser from the command line via a companion extension"

[[bin]]
name = "bctl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "7.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tungstenite = "0.30.0"

[build-dependencies]
serde_json = "1.0.154"
